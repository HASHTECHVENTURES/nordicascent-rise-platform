name: CI

# Appendix A · Integrations §6 — baseline CI. Installs deps, lints and builds on
# every push/PR. Database migrations remain applied via the Supabase CLI/MCP
# (documented in README), so they are intentionally not part of this pipeline.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Real values come from repo secrets in production; placeholders keep
          # the build green when secrets are not configured.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
